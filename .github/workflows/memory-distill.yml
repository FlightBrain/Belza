name: memory-distill

on:
  schedule:
    - cron: '0 14 * * *' # ~7am PT daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: memory-distill
  cancel-in-progress: false

jobs:
  distill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Distill new sdr-playersonly messages into profile memory
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: node scripts/memory-distill.js

      - name: Commit state and audit updates
        run: |
          git config user.name "memory-distill bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/
          if ! git diff --cached --quiet; then
            git commit -m "memory-distill: scan update"
            git push
          else
            echo "no changes to commit"
          fi
